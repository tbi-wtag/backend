# A generic, single database configuration.

[alembic]
# path to migration scripts (this tells Alembic to look in your 'alembic' folder)
script_location = alembic

# template used to generate migration files
# this formats the generated file names like: 2023_10_24_1430-a1b2c3d4e5f6_initial_table_setup.py
file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# as well as the filename.
timezone = UTC

# This is just a placeholder! 
# Because we wrote config.set_main_option("sqlalchemy.url", ...) in your env.py, 
# Alembic ignores this line and uses your real PostgreSQL URL from the .env file instead.
sqlalchemy.url = sqlite:///./placeholder.db

[post_write_hooks]
# You can add formatters like 'ruff' or 'black' here later to auto-format your migration files

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S